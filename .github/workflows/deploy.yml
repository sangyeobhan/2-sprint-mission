name: CD - Deploy to Amazon ECS

on:
  push:
    branches: [ release ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build, Push to Public ECR, and Deploy to ECS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials for Public ECR
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push image to Amazon ECR Public
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ vars.ECR_REPOSITORY_URI }}:latest
            ${{ vars.ECR_REPOSITORY_URI }}:${{ github.sha }}




      - name: Configure AWS credentials for ECS Region
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download current task definition template
        run: |
          aws ecs describe-task-definition --task-definition ${{ vars.ECS_TASK_DEFINITION_FAMILY }} --query taskDefinition > task-definition-template.json
          echo "Task definition template downloaded as task-definition-template.json"

      - name: Render new task definition with updated image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition-template.json
          container-name: ${{ vars.ECS_CONTAINER_NAME }}
          image: ${{ vars.ECR_REPOSITORY_URI }}:${{ github.sha }}


      - name: Clean up rendered task definition for deployment
        id: clean-task-def
        run: |
          RENDERED_TASK_DEF_FILE_PATH="${{ steps.render-task-def.outputs.task-definition }}"

          jq 'del(.enableFaultInjection) | 
              del(.taskDefinitionArn) | 
              del(.revision) | 
              del(.status) | 
              del(.requiresAttributes) | 
              del(.compatibilities) | 
              del(.registeredAt) | 
              del(.registeredBy) |
              del(try .tags[])' \
             "$RENDERED_TASK_DEF_FILE_PATH" > cleaned-task-definition.json

          echo "Cleaned task definition saved to cleaned-task-definition.json"
          cat cleaned-task-definition.json # 디버깅용

          echo "cleaned_task_def_path=cleaned-task-definition.json" >> $GITHUB_OUTPUT

      - name: Deploy new task definition to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.clean-task-def.outputs.cleaned_task_def_path }} # <--- 수정된 파일 경로 사용
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true
          force-new-deployment: true